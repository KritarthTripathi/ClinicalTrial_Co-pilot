joins:
- id: J01
  one: hcp_summary_with_territory_and_tm_info
  many: hcp_rx_summary_report
  'on':
  - hcp_ref_id
  - product_name
  cardinality: one_to_one
  safe_as: join
  many_side_match_rate: 1.0
  one_side_coverage: 1.0
  requires_filter: null
  pattern: hcp_summary_with_territory_and_tm_info a JOIN hcp_rx_summary_report b ON a.hcp_ref_id = b.hcp_ref_id AND a.product_name = b.product_name
  note: 'Unique only within one grain_code/grain_end_date: filter these (the *_latest views already hold one period).'
  approved: true
- id: J02
