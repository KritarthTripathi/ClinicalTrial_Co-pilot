  many_side_match_rate: 1.0
  one_side_coverage: 1.0
  requires_filter: null
  pattern: hcp_activity_calls_vae_suggestions WHERE hcp_ref_id IN (SELECT hcp_ref_id FROM hcp_summary_with_territory_and_tm_info WHERE <filter>)
  note: 'hcp_activity_calls_vae_suggestions holds numbers that would be counted several times after a JOIN; use  WHERE key IN (SELECT key FROM ...)  instead. Unique only within one activity_type/grain_code/grain_end_date:
