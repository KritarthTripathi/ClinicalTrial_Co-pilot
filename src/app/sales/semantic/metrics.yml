# Semantic layer for schema v2: what the agent may query, how metrics are defined, and the default rules.
version: 2
defaults:
  grain_code: "13W"                  # used when the question names no period
  rank_metric: trx                   # used when the question names no metric
  rank_direction: DESC
  list_limit: 10                     # "top prescribers" without a number
  min_previous_volume_for_trending: 10
grains:
  W: "this week (7 days)"
  4W: "last 4 weeks"
  M: "the month (weeks ending in the latest calendar month, 4 or 5 weeks)"
  13W: "last 13 weeks"
period_rule: >
  Reporting is weekly (weeks end on Thursday). The *_latest views already contain only the most recent period of each
  grain_code, so no date filter is needed. The *_trend views add the previous period's numbers (previous_trx ...).
relations:
  hcp_summary_with_territory_and_tm_info:
    kind: table
    description: "One row per HCP and per product the HCP prescribes, with office address, territory, district, area, division and territory manager."
    columns: [hcp_ref_id, hcp_full_name, address_line, city, state, territory_name, district_name, area_name, division_name, territory_manager_name, territory_manager_email, product_name]
    rules: ["Use for: which HCPs write at an office address, which HCPs prescribe a product in a territory/district/area, which HCPs a territory manager manages.", "Return DISTINCT hcp_ref_id and hcp_full_name."]
  territory_alignment_hierarchy:
    kind: table
    description: "One row per territory: area, district, division, state and the territory manager (name and email)."
    columns: [area_name, district_name, territory_name, division_name, state, territory_manager_name, territory_manager_email]
    rules: ["Use to translate a territory manager into a territory, or to list districts and territories of an area."]
  v_hcp_rx_latest:
    kind: view
    base_table: hcp_rx_summary_report
    needs_grain: true
    description: "Latest period of HCP prescriptions. One row per HCP, product and grain_code."
    columns: [hcp_ref_id, hcp_full_name, territory_name, district_name, area_name, division_name, product_name, trx, nbrx, nts, grain_code, grain_start_date, grain_end_date]
    rules: ["Always filter grain_code. To rank HCPs SUM the metric and GROUP BY hcp_ref_id, hcp_full_name."]
  v_hcp_rx_trend:
    kind: view
    base_table: hcp_rx_summary_report
    needs_grain: true
    description: "Latest period next to the previous period, per HCP and product. trx_change_pct is the percent change of trx versus previous_trx."
    columns: [hcp_ref_id, hcp_full_name, territory_name, district_name, area_name, division_name, product_name, grain_code, trx, nbrx, nts, previous_trx, previous_nbrx, previous_nts, trx_change, trx_change_pct]
    rules: ["Trending up = highest trx_change_pct; require previous_trx >= 10 so tiny numbers do not dominate."]
  v_activity_latest:
    kind: view
    base_table: hcp_activity_calls_vae_suggestions
    needs_grain: true
    description: "Latest period of calls and approved emails (VAE) per HCP. suggested_engagements = suggested, activity_count = done."
    columns: [hcp_ref_id, hcp_full_name, territory_name, district_name, area_name, division_name, activity_type, suggested_engagements, activity_count, grain_code, grain_start_date, grain_end_date]
    rules: ["activity_type is 'CALL' or 'VAE'. Always filter grain_code and activity_type.", "Use NULLIF when dividing."]
  v_geo_latest:
    kind: view
    base_table: rx_report_summary_geo
    needs_grain: true
    needs_geo_level: true
    description: "Latest period of prescriptions rolled up by geography. geo_level is TERRITORY, DISTRICT, AREA or DIVISION."
    columns: [geo_level, area_name, district_name, territory_name, division_name, product_name, trx, nbrx, nts, grain_code, grain_start_date, grain_end_date]
    rules: ["Always filter geo_level AND grain_code (levels overlap: never add up different levels).", "Name columns below the row's level contain 'ALL'. SUM across product_name is correct."]
  v_geo_trend:
    kind: view
    base_table: rx_report_summary_geo
    needs_grain: true
    needs_geo_level: true
    description: "Geo roll-up of the latest period next to the previous period."
    columns: [geo_level, area_name, district_name, territory_name, division_name, product_name, grain_code, trx, nbrx, nts, previous_trx, previous_nbrx, previous_nts]
    rules: ["Always filter geo_level AND grain_code. Percent change = (SUM(trx) - SUM(previous_trx)) * 100.0 / NULLIF(SUM(previous_trx), 0)."]
metrics:
  trx: {label: "Total prescriptions (TRx)", sql: "SUM(trx)"}
  nbrx: {label: "New-to-brand prescriptions (NBRx)", sql: "SUM(nbrx)"}
  nts: {label: "NTS (definition to be confirmed)", sql: "SUM(nts)"}
  reach_pct: {label: "Call reach %", relation: v_activity_latest, filter: "activity_type = 'CALL'", sql: "SUM(activity_count) * 100.0 / NULLIF(SUM(suggested_engagements), 0)"}
  vae_status_pct: {label: "VAE status %", relation: v_activity_latest, filter: "activity_type = 'VAE'", sql: "SUM(activity_count) * 100.0 / NULLIF(SUM(suggested_engagements), 0)"}
  remaining_calls: {label: "Suggested calls still to make, per HCP", relation: v_activity_latest, filter: "activity_type = 'CALL'", sql: "suggested_engagements - activity_count", order: DESC, limit: 10}
  remaining_vae: {label: "Suggested VAE still to send, per HCP", relation: v_activity_latest, filter: "activity_type = 'VAE'", sql: "suggested_engagements - activity_count", order: DESC, limit: 10}
global_rules:
  - "Return exactly ONE SELECT statement and nothing else."
  - "Use only the listed relations and only their listed columns."
  - "Never use CURRENT_DATE or NOW(): the data is fixed."
  - "To filter by a territory manager use: territory_name = (SELECT territory_name FROM territory_alignment_hierarchy WHERE territory_manager_name = '<value>')."
