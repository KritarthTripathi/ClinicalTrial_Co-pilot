- id: k01
  question: "Total NBRx of our brand by specialty"
  reference_sql: "SELECT specialty, SUM(nbrx) FROM v_hcp_rx WHERE is_ours GROUP BY specialty"
  compare: rows_set
- id: k02
  question: "Which rep made the fewest calls?"
  reference_sql: "SELECT rep_id FROM v_hcp_activity GROUP BY rep_id ORDER BY SUM(calls) ASC LIMIT 1"
  compare: first_col_set
- id: k03
  question: "How many plans had more than 50 rejected claims for our brand?"
  reference_sql: "SELECT COUNT(*) FROM (SELECT plan_id FROM v_payer_access WHERE is_ours GROUP BY plan_id HAVING SUM(rejected) > 50)"
  compare: scalar
- id: k04
  question: "Total prescriptions by payer name"
  reference_sql: "SELECT payer_name, SUM(trx) FROM v_hcp_rx GROUP BY payer_name"
  compare: rows_set
- id: k05
  question: "VAE open rate by month"
  reference_sql: "SELECT month, SUM(vae_opened) * 1.0 / SUM(vae_sent) FROM v_hcp_activity GROUP BY month"
  compare: rows_set
- id: k06
  question: "Total VAE sent per rep"
  reference_sql: "SELECT rep_id, SUM(vae_sent) FROM v_hcp_activity GROUP BY rep_id"
  compare: rows_set
- id: k07
  question: "What was the total TRx of our brand in the last 4 weeks?"
  reference_sql: "SELECT SUM(trx) FROM v_hcp_rx WHERE is_ours AND week_start > (SELECT MAX(week_start) FROM v_hcp_rx) - INTERVAL 28 DAY"
  compare: scalar
- id: k08
  question: "Reject rate by payer name for our brand"
  reference_sql: "SELECT payer_name, SUM(rejected) * 1.0 / SUM(submitted) FROM v_payer_access WHERE is_ours GROUP BY payer_name"
  compare: rows_set
- id: k09
  question: "How many doctors received at least 5 calls?"
  reference_sql: "SELECT COUNT(*) FROM (SELECT hcp_id FROM v_hcp_activity GROUP BY hcp_id HAVING SUM(calls) >= 5)"
  compare: scalar
- id: k10
  question: "Total calls for Rheumatology doctors"
  reference_sql: "SELECT SUM(calls) FROM v_hcp_activity WHERE specialty = 'Rheumatology'"
  compare: scalar
