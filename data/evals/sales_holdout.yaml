- id: h01
  agent: sales_hcp
  question: Who are the top 5 prescribers of zent in the last 13 weeks?
  reference_sql: SELECT hcp_ref_id, SUM(trx) AS trx FROM v_hcp_rx_latest WHERE grain_code = '13W' AND product_name = 'zent' GROUP BY hcp_ref_id ORDER BY trx DESC LIMIT 5
  compare: first_col_set
- id: h02
  agent: sales_hcp
  question: Which hcps are prescribing glisol in Cal2 district?
  reference_sql: SELECT DISTINCT hcp_ref_id, hcp_full_name FROM hcp_summary_with_territory_and_tm_info WHERE product_name = 'glisol' AND district_name = 'Cal2 district'
  compare: first_col_set
- id: h03
  agent: sales_hcp
  question: Which hcps are managed by yusuf.kapoor@firm.comp.com?
  reference_sql: SELECT DISTINCT hcp_ref_id, hcp_full_name FROM hcp_summary_with_territory_and_tm_info WHERE territory_manager_email = '{mask:yusuf.kapoor@firm.comp.com}'
  compare: first_col_set
- id: h04
  agent: sales_geo
  question: Which area has the most NTS for brainic?
  reference_sql: SELECT area_name, SUM(nts) AS nts FROM v_geo_latest WHERE geo_level = 'AREA' AND grain_code = '13W' AND product_name = 'brainic' GROUP BY area_name ORDER BY nts DESC LIMIT 1
  compare: first_col_set
- id: h05
  agent: sales_geo
  question: Which district has the least TRx in the latest month for the GI division?
  reference_sql: SELECT district_name, SUM(trx) AS trx FROM v_geo_latest WHERE geo_level = 'DISTRICT' AND grain_code = 'M' AND division_name = 'GI' GROUP BY district_name ORDER BY trx ASC LIMIT 1
  compare: first_col_set
- id: h06
  agent: sales_activity
  question: What was my reach in the most recent week for mid_terr_3?
  reference_sql: SELECT SUM(activity_count) * 100.0 / NULLIF(SUM(suggested_engagements), 0) AS pct FROM v_activity_latest WHERE activity_type = 'CALL' AND grain_code = 'W' AND territory_name = 'mid_terr_3'
  compare: scalar
- id: h07
  agent: sales_activity
  question: What was my VAE status in the last 4 weeks for North East Area?
  reference_sql: SELECT SUM(activity_count) * 100.0 / NULLIF(SUM(suggested_engagements), 0) AS pct FROM v_activity_latest WHERE activity_type = 'VAE' AND grain_code = '4W' AND area_name = 'North East Area'
  compare: scalar
- id: h08
  agent: sales_activity
  question: How many suggested calls do I have to make in the latest month for ne_terr_2?
  reference_sql: SELECT hcp_ref_id, suggested_engagements - activity_count AS remaining FROM v_activity_latest WHERE activity_type = 'CALL' AND grain_code = 'M' AND territory_name = 'ne_terr_2' ORDER BY remaining DESC LIMIT 10
  compare: first_col_set
- id: h09
  agent: sales_geo
  question: Which territory has the most NBRx for jalric in the latest month?
  reference_sql: SELECT territory_name, SUM(nbrx) AS nbrx FROM v_geo_latest WHERE geo_level = 'TERRITORY' AND grain_code = 'M' AND product_name = 'jalric' GROUP BY territory_name ORDER BY nbrx DESC LIMIT 1
  compare: first_col_set
- id: h10
  agent: sales_geo
  question: Which 3 territories are trending up the most in TRx in California Area?
  reference_sql: SELECT territory_name, (SUM(trx) - SUM(previous_trx)) * 100.0 / NULLIF(SUM(previous_trx), 0) AS trx_change_pct FROM v_geo_trend WHERE geo_level = 'TERRITORY' AND grain_code = '13W' AND area_name = 'California Area' GROUP BY territory_name HAVING SUM(previous_trx) >= 10 ORDER BY trx_change_pct DESC LIMIT 3
  compare: first_col_set
